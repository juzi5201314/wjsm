[package]
name = "wjsm"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/wjsm-parser",
    "crates/wjsm-semantic",
    "crates/wjsm-ir",
    "crates/wjsm-artifact-format",
    "crates/wjsm-native-abi",
    "crates/wjsm-backend-native",
    "crates/wjsm-host-native",
    "crates/wjsm-runtime",
    "crates/wjsm-cli",
    "crates/wjsm-test262",
    "crates/wjsm-module",
    "crates/wjsm-gc-bench",
    "crates/wjsm-bench",
    "crates/wjsm-snapshot-format",
    "crates/wjsm-host",
    "crates/wjsm-builtins",
    "crates/wjsm-gc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
cranelift-codegen = { version = "=0.134.3", default-features = false, features = ["std", "host-arch", "unwind"] }
cranelift-control = { version = "=0.134.3", default-features = false }
cranelift-frontend = { version = "=0.134.3", default-features = false, features = ["std"] }
cranelift-module = { version = "=0.134.3", default-features = false, features = ["std"] }
cranelift-native = { version = "=0.134.3", default-features = false }
cranelift-object = { version = "=0.134.3", default-features = false, features = ["unwind"] }
clap_complete = "4.6.0"
swc_core = { version = "62.0.0", features = ["ecma_parser", "ecma_ast", "common", "ecma_visit", "ecma_ast_serde", "ecma_codegen"] }
thiserror = "2.0.18"
libc = "0.2"
object = { version = "=0.39.0", default-features = false, features = ["read_core", "elf", "macho", "pe", "coff", "std"] }
target-lexicon = "=0.13.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_SystemInformation"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "net", "io-util", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
rayon = "1.10"
walkdir = "2"
comfy-table = "7"
colored = "2"
notify = "8.0"
mio = { version = "1", features = ["net", "os-poll"] }
sha2 = "0.10"
regress = "0.11"
regex = "1"
toml = "0.9.12"
# 保留 Reqwest 的默认 HTTP 行为，只以 rustls 替代重复的 native-tls/OpenSSL。
reqwest = { version = "0.12", default-features = false, features = [
    "charset",
    "http2",
    "stream",
    "system-proxy",
] }
proptest = "1.9.0"
url = "2"
encoding_rs = "0.8"
unicode-normalization = "0.1"
get_if_addrs = "0.5.3"
sysinfo = "0.39.5"
hdrhistogram = { version = "7.5.4", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
webpki-roots = "0.26"

flate2 = "1"
brotli = "8"
tar = "0.4"
wait-timeout = "0.2"
# 与 cranelift-codegen/cranelift-object 的 unwind 特性锁定的同一版本，用于本地
# 生成 Mach-O `.eh_frame`（Windows `.pdata` 不经过 gimli）。必须保持 `=0.33.1`。
gimli = { version = "=0.33.1", default-features = false, features = ["write"] }
[dependencies]
anyhow = { workspace = true }
wjsm-cli = { path = "crates/wjsm-cli" }

[features]
default = []

[dev-dependencies]
anyhow = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true }
wjsm-runtime = { path = "crates/wjsm-runtime" }

# 仅对 Cranelift 这类编译密集型依赖启用优化，保持本仓库自身 crate 仍走快速 debug 编译。
# Native image 编译的未优化依赖是执行基线的主要开销。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package.cranelift-codegen]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.cranelift-frontend]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.cranelift-codegen-meta]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.cranelift-assembler-x64]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.wjsm-runtime]
opt-level = 3
# memchr 的 SIMD 子串搜索（find_memory_c_string 用）在未优化 debug 下
# 带大量 UB 检查 + 未内联，实测占 bootstrap ~35% 指令；opt 后大幅收缩。
[profile.dev.package.regalloc2]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.cranelift-entity]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.cranelift-bitset]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.cranelift-module]
opt-level = 3
debug-assertions = false

[profile.dev.package.cranelift-object]
opt-level = 3
debug-assertions = false

[profile.dev.package.memchr]
opt-level = 3
