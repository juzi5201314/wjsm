nextest-version = "0.9.122"

# 默认测试必须在 3s 内完成；超过即视为死锁、未关闭资源或性能回归。
#
# codegen 相关的环境开关（均不在此设默认值，测试跑的就是生产配置）：
# - `WJSM_VERIFY_CLIF=0` 关闭 CLIF verifier（约省 20% codegen，但失去 lowering 门禁）。
# - `WJSM_OPT_LEVEL=none` 关闭 Cranelift egraph 中端（GVN / alias analysis / LICM）。
#   并行 codegen 落地后两档在全量套件上量不出差异，因此保持 speed 以覆盖优化后端。

[profile.default]
test-threads = "num-cpus"
failure-output = "immediate-final"
success-output = "never"
status-level = "pass"
final-status-level = "all"
fail-fast = false
# 3s 全局硬超时。
slow-timeout = { period = "3s", terminate-after = 1 }

[test-groups]
# 资源隔离（端口 / 共享 cache 路径），与执行耗时无关。
cluster-ipc = { max-threads = 1 }
runtime-cache-delete = { max-threads = 1 }

# cluster IPC：同二进制内串行并独占执行槽，避免端口和子进程互相干扰；
# 仍继承全局 3s 硬门禁。
[[profile.default.overrides]]
filter = 'binary(cluster_ipc)'
test-group = 'cluster-ipc'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'test(/modules__runtime_loading.*cjs_require_cache_delete/)'
test-group = 'runtime-cache-delete'

# worker_threads / async_local_worker 会在同进程内起第二个 NativeRuntime，
# node_builtin_perf_hooks 模块 fixture 会初始化大型 builtin 闭包；独占 CPU
# 避免初始化阶段互相争用，仍继承全局 3s 硬门禁。
[[profile.default.overrides]]
filter = 'test(/modules__(async_local_worker|node_builtin_perf_hooks|node_builtin_worker_threads)_/)'
threads-required = 'num-cpus'

# perf_hooks 每例都会编译较大的 builtin 闭包；整组独占 CPU，避免冷缓存
# 初始化与其他 codegen 用例争用，仍继承全局 3s 硬门禁。
[[profile.default.overrides]]
filter = 'test(/happy__node_builtin_perf_hooks_/)'
threads-required = 'num-cpus'

# native-executable 测试会打包并启动 packed exe；独占 CPU，避免大型文件 I/O
# 与 worker 二次 Runtime 初始化互相争用，仍继承全局 3s 硬门禁。
[[profile.default.overrides]]
filter = 'binary(/native_executable/)'
threads-required = 'num-cpus'

# r1_accessor_slots 会执行 20000 次分配；独占 CPU，避免 GC 压力与其他测试争用，
# 仍继承全局 3s 硬门禁。
[[profile.default.overrides]]
filter = 'test(/happy__r1_accessor_slots/)'
threads-required = 'num-cpus'

# large_array_churn 是 GC 协作回收压力测试；独占 CPU，仍继承全局 3s 硬门禁。
[[profile.default.overrides]]
filter = 'test(/large_array_churn_collects_before_cooperative_poll/)'
threads-required = 'num-cpus'

# GC 压力与 live-set 耗尽用例会执行多轮完整回收；独占 CPU，避免并发抖动，
# 仍继承全局 3s 硬门禁。
[[profile.default.overrides]]
filter = 'test(/(allocation_pressure_collects_with_each_runtime_algorithm|live_set_exhaustion_is_observable_range_error_)/)'
threads-required = 'num-cpus'

# host_table_reclaim 使用 4MB 小堆、ZGC 与 5000 次闭包分配；独占 CPU，
# 避免 GC 压力与其他测试争用，仍继承全局 3s 硬门禁。
[[profile.default.overrides]]
filter = 'test(/host_table_reclaim::/)'
threads-required = 'num-cpus'

# REPL PTY 会冷启动 debug `wjsm` 并执行首次 eval；独占 CPU，仍继承全局 3s 硬门禁。
[[profile.default.overrides]]
filter = 'binary(repl_line_edit)'
threads-required = 'num-cpus'
