nextest-version = "0.9.122"

# 默认测试必须在 3s 内完成；超过即视为死锁、未关闭资源或性能回归。
#
# codegen 相关的环境开关（均不在此设默认值，测试跑的就是生产配置）：
# - `WJSM_VERIFY_CLIF=0` 关闭 CLIF verifier（约省 20% codegen，但失去 lowering 门禁）。
# - `WJSM_OPT_LEVEL=none` 关闭 Cranelift egraph 中端（GVN / alias analysis / LICM）。
#   并行 codegen 落地后两档在全量套件上量不出差异，因此保持 speed 以覆盖优化后端。

[profile.default]
test-threads = "num-cpus"
failure-output = "immediate-final"
success-output = "never"
status-level = "pass"
final-status-level = "all"
fail-fast = false
# 3s 全局硬超时。
slow-timeout = { period = "3s", terminate-after = 1 }

[test-groups]
# 资源隔离（端口 / 共享 cache 路径），与执行耗时无关。
cluster-ipc = { max-threads = 1 }
runtime-cache-delete = { max-threads = 1 }

# cluster IPC：同二进制内串行并独占执行槽。首次运行会冷编译父进程并启动
# 两个真实子进程；3s 报慢测，连续三个周期（9s）才判定挂死。
[[profile.default.overrides]]
filter = 'binary(cluster_ipc)'
test-group = 'cluster-ipc'
threads-required = "num-cpus"
slow-timeout = { period = "3s", terminate-after = 3 }

[[profile.default.overrides]]
filter = 'test(/modules__runtime_loading.*cjs_require_cache_delete/)'
test-group = 'runtime-cache-delete'

# worker_threads / async_local_worker 会在同进程内起第二个 NativeRuntime
# （worker 源码单独编译 + thread spawn），单独跑约 2s 并已吃满多核。
# perf_hooks histogram_clone / native_http 会显式 gc()，并且 lowering 后
# 的 root frame 更大；和其它 CPU 密集 fixture 争抢后会越过 3s 硬门禁。
# 要求独占执行槽，门禁本身不放宽。
[[profile.default.overrides]]
filter = 'test(/modules__(async_local_worker|node_builtin_perf_hooks_native_entries|node_builtin_worker_threads)_/) + test(/happy__node_builtin_perf_hooks_(histogram_clone|native_http)/)'
threads-required = 'num-cpus'

# host_table_reclaim：4MB 小堆 + ZGC + 20000 次闭包分配，本质是 GC 回收
# 压力测试；单个约 1.5s（debug 模式 host 层未优化），并行争抢 CPU 后越过
# 3s 硬门禁。要求独占执行槽，门禁本身不放宽。
[[profile.default.overrides]]
filter = 'test(host_table_reclaim)'
threads-required = 'num-cpus'
