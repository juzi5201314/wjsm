nextest-version = "0.9.122"

# 默认测试必须在 3s 内完成；超过即视为死锁、未关闭资源或性能回归。
#
# codegen 相关的环境开关（均不在此设默认值，测试跑的就是生产配置）：
# - `WJSM_VERIFY_CLIF=0` 关闭 CLIF verifier（约省 20% codegen，但失去 lowering 门禁）。
# - `WJSM_OPT_LEVEL=none` 关闭 Cranelift egraph 中端（GVN / alias analysis / LICM）。
#   并行 codegen 落地后两档在全量套件上量不出差异，因此保持 speed 以覆盖优化后端。

[profile.default]
test-threads = "num-cpus"
failure-output = "immediate-final"
success-output = "never"
status-level = "pass"
final-status-level = "all"
fail-fast = false
# 3s 全局硬超时。
slow-timeout = { period = "3s", terminate-after = 1 }

[test-groups]
# 资源隔离（端口 / 共享 cache 路径），与执行耗时无关。
cluster-ipc = { max-threads = 1 }
runtime-cache-delete = { max-threads = 1 }

# cluster IPC：同二进制内串行并独占执行槽。首次运行会冷编译父进程并启动
# 两个真实子进程；3s 报慢测，连续三个周期（9s）才判定挂死。
[[profile.default.overrides]]
filter = 'binary(cluster_ipc)'
test-group = 'cluster-ipc'
threads-required = "num-cpus"
slow-timeout = { period = "3s", terminate-after = 3 }

[[profile.default.overrides]]
filter = 'test(/modules__runtime_loading.*cjs_require_cache_delete/)'
test-group = 'runtime-cache-delete'

# worker_threads / async_local_worker 会在同进程内起第二个 NativeRuntime
# （worker 源码单独编译 + thread spawn）；node_builtin_perf_hooks 模块 fixture
# 则需初始化大型 builtin 闭包。两类都需要独占 CPU 执行槽。冷缓存下完整启动
# 可能超过 3s，因此沿用 cluster IPC 的三周期门禁：3s 报慢、9s 才终止；普通
# fixture 仍保持 3s 硬门禁。
[[profile.default.overrides]]
filter = 'test(/modules__(async_local_worker|node_builtin_perf_hooks|node_builtin_worker_threads)_/)'
threads-required = 'num-cpus'
slow-timeout = { period = '3s', terminate-after = 3 }

# perf_hooks 每例都会编译较大的 builtin 闭包。跨 nextest 进程共享的磁盘缓存只保证
# 后续命中；ABI 变化后的首次冷启动与资源回收抖动都可能越过 3s。整组独占 CPU，
# 保留 3s 慢测信号并在连续三个周期后终止，普通 fixture 仍保持 3s 硬门禁。
[[profile.default.overrides]]
filter = 'test(/happy__node_builtin_perf_hooks_/)'
threads-required = 'num-cpus'
slow-timeout = { period = '3s', terminate-after = 3 }

# native-executable 集成测试每次都打包 stub+payload，再冷启动 packed exe；
# worker 用例还会在子线程二次编译。当前 Intl 数据体积下冷启动约 10s，3s 报慢、15s 才终止。
[[profile.default.overrides]]
filter = 'binary(/native_executable/)'
threads-required = 'num-cpus'
slow-timeout = { period = '3s', terminate-after = 5 }

# r1_accessor_slots：20000 次分配后再读 accessor；单独约 1s，全量并行时
# 堆与 debug `wjsm` 启动抖动会越过 3s。独占 CPU，3s 报慢、9s 才终止。
[[profile.default.overrides]]
filter = 'test(/happy__r1_accessor_slots/)'
threads-required = 'num-cpus'
slow-timeout = { period = '3s', terminate-after = 3 }

# large_array_churn：GC 协作回收压力。单独约 2.4s，调度抖动会越过 3s。
[[profile.default.overrides]]
filter = 'test(/large_array_churn_collects_before_cooperative_poll/)'
threads-required = 'num-cpus'
slow-timeout = { period = '3s', terminate-after = 3 }

# GC 压力与 live-set 耗尽用例会执行多轮完整回收；全量并发时 CPU 争用可越过 3s。
# 每例独占 CPU，保留 3s 慢测信号并以 9s 捕获真实卡死。
[[profile.default.overrides]]
filter = 'test(/(allocation_pressure_collects_with_each_runtime_algorithm|live_set_exhaustion_is_observable_range_error_)/)'
threads-required = 'num-cpus'
slow-timeout = { period = '3s', terminate-after = 3 }

# host_table_reclaim：4MB 小堆 + ZGC + 20000 次闭包分配，本质是 GC 回收
# 压力测试。单独执行约 2.7s，调度抖动会越过默认 3s，因此独占 CPU 且采用
# 三周期门禁：3s 报慢、9s 才终止，仍能捕获卡死或资源未释放。
[[profile.default.overrides]]
filter = 'test(/host_table_reclaim::/)'
threads-required = 'num-cpus'
slow-timeout = { period = '3s', terminate-after = 3 }

# REPL PTY：冷启动 debug `wjsm` + 首次 eval 编译。3s 报慢，连续三个周期才终止。
[[profile.default.overrides]]
filter = 'binary(repl_line_edit)'
threads-required = 'num-cpus'
slow-timeout = { period = '3s', terminate-after = 3 }
