nextest-version = "0.9.122"

# 默认 profile 只运行无独占资源、无压力负载的快速正确性测试。
# `full` profile 恢复全部测试，`slow` profile 只运行进程、网络、PTY、GC、Loom
# 与复杂度压力测试；三者都保留 3s 单例硬超时。
#
# codegen 开关不在此设默认值，测试始终覆盖生产配置。

[profile.default]
default-filter = '''
not (
  binary(/^(cluster_ipc|gc_concurrency_model|gc_loom_model|handle_table|native_executable|native_executable_contract|node_vm_timeout_isolation|perf_hooks_fetch_resource|repl_line_edit)$/)
  | test(/(^|::)slow__/)
  | test(/happy__(async_hooks_|async_resource_|atomics_agent_notify|gc_|node_builtin_perf_hooks_|node_net_fetch_failure_chain|r1_accessor_slots|r2_ic_proto_and_gc|runtime_string_gc_roots|streams_byob_gc_pending_view)/)
  | test(/modules__(async_local_(dgram|net|tls)|node_builtin_(cluster|dgram|http|https|net|perf_hooks|tls|worker_threads)_)/)
  | test(/(allocation_pressure_collects_with_each_runtime_algorithm|host_table_reclaim::|large_array_churn_collects_before_cooperative_poll|live_set_exhaustion_is_observable_range_error_|lower_bundle_cached_perf_hooks_layout_and_cache_hit|native_executable_worker_file_collection_contracts)/)
)
'''
test-threads = "num-cpus"
failure-output = "immediate-final"
success-output = "never"
status-level = "pass"
final-status-level = "all"
fail-fast = false
# 3s 全局硬超时。
slow-timeout = { period = "3s", terminate-after = 1 }

[profile.full]
default-filter = 'all()'

[profile.slow]
default-filter = '''
binary(/^(cluster_ipc|gc_concurrency_model|gc_loom_model|handle_table|native_executable|native_executable_contract|node_vm_timeout_isolation|perf_hooks_fetch_resource|repl_line_edit)$/)
| test(/(^|::)slow__/)
| test(/happy__(async_hooks_|async_resource_|atomics_agent_notify|gc_|node_builtin_perf_hooks_|node_net_fetch_failure_chain|r1_accessor_slots|r2_ic_proto_and_gc|runtime_string_gc_roots|streams_byob_gc_pending_view)/)
| test(/modules__(async_local_(dgram|net|tls)|node_builtin_(cluster|dgram|http|https|net|perf_hooks|tls|worker_threads)_)/)
| test(/(allocation_pressure_collects_with_each_runtime_algorithm|host_table_reclaim::|large_array_churn_collects_before_cooperative_poll|live_set_exhaustion_is_observable_range_error_|lower_bundle_cached_perf_hooks_layout_and_cache_hit|native_executable_worker_file_collection_contracts)/)
'''

[test-groups]
# 资源隔离（端口 / 共享 cache 路径），与执行耗时无关。
cluster-ipc = { max-threads = 1 }
runtime-cache-delete = { max-threads = 1 }

# cluster IPC：同二进制内串行并独占执行槽，避免端口和子进程互相干扰；
# 仍继承全局 3s 硬门禁。
[[profile.default.overrides]]
filter = 'binary(cluster_ipc)'
test-group = 'cluster-ipc'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'test(/modules__runtime_loading.*cjs_require_cache_delete/)'
test-group = 'runtime-cache-delete'

# worker_threads 会在同进程内起第二个 NativeRuntime，node_builtin_perf_hooks 模块
# fixture 会初始化大型 builtin 闭包；独占 CPU 避免初始化阶段互相争用，仍继承
# 全局 3s 硬门禁。
[[profile.default.overrides]]
filter = 'test(/modules__(node_builtin_perf_hooks|node_builtin_worker_threads)_/)'
threads-required = 'num-cpus'

# perf_hooks 每例都会编译较大的 builtin 闭包；整组独占 CPU，避免冷缓存
# 初始化与其他 codegen 用例争用，仍继承全局 3s 硬门禁。
[[profile.default.overrides]]
filter = 'test(/happy__node_builtin_perf_hooks_/)'
threads-required = 'num-cpus'

# native-executable 测试会打包并启动 packed exe；独占 CPU，避免大型文件 I/O
# 与 worker 二次 Runtime 初始化互相争用，仍继承全局 3s 硬门禁。
[[profile.default.overrides]]
filter = 'binary(/native_executable/)'
threads-required = 'num-cpus'

# r1_accessor_slots 会执行 20000 次分配；独占 CPU，避免 GC 压力与其他测试争用，
# 仍继承全局 3s 硬门禁。
[[profile.default.overrides]]
filter = 'test(/happy__r1_accessor_slots/)'
threads-required = 'num-cpus'

# large_array_churn 是 GC 协作回收压力测试；独占 CPU，仍继承全局 3s 硬门禁。
[[profile.default.overrides]]
filter = 'test(/large_array_churn_collects_before_cooperative_poll/)'
threads-required = 'num-cpus'

# GC 压力与 live-set 耗尽用例会执行多轮完整回收；独占 CPU，避免并发抖动，
# 仍继承全局 3s 硬门禁。
[[profile.default.overrides]]
filter = 'test(/(allocation_pressure_collects_with_each_runtime_algorithm|live_set_exhaustion_is_observable_range_error_)/)'
threads-required = 'num-cpus'

# host_table_reclaim 使用 4MB 小堆、ZGC 与 5000 次闭包分配；独占 CPU，
# 避免 GC 压力与其他测试争用，仍继承全局 3s 硬门禁。
[[profile.default.overrides]]
filter = 'test(/host_table_reclaim::/)'
threads-required = 'num-cpus'

# REPL PTY 会冷启动 debug `wjsm` 并执行首次 eval；独占 CPU，仍继承全局 3s 硬门禁。
[[profile.default.overrides]]
filter = 'binary(repl_line_edit)'
threads-required = 'num-cpus'
