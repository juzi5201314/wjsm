nextest-version = "0.9.122"

# 测试只验证正确性：默认 profile 只跑快速、确定性、无真实网络/进程的用例。
# `slow`/`full` profile 保留慢用例（GC 压力、PTY、原生可执行打包、
# perf_hooks/worker_threads 模块初始化等），并给宽裕的 slow-timeout；
# 默认 profile 的 30s 硬门禁不适用于它们。

[profile.default]
default-filter = '''
not (
  binary(/^(gc_concurrency_model|gc_loom_model|handle_table|native_executable|native_executable_contract|node_vm_timeout_isolation|repl_line_edit)$/)
  | test(/(^|::)slow__/)
  | test(/happy__(async_hooks_|async_resource_|atomics_agent_notify|gc_|node_builtin_perf_hooks_|r1_accessor_slots|r2_ic_proto_and_gc|runtime_string_gc_roots|streams_byob_gc_pending_view)/)
  | test(/modules__node_builtin_(cluster|perf_hooks|worker_threads)_/)
  | test(/(allocation_pressure_collects_with_each_runtime_algorithm|host_table_reclaim::|large_array_churn_collects_before_cooperative_poll|live_set_exhaustion_is_observable_range_error_|lower_bundle_cached_perf_hooks_layout_and_cache_hit|native_executable_worker_file_collection_contracts)/)
) or test(happy__gc_safepoint_free_fib)
'''
test-threads = "num-cpus"
failure-output = "immediate-final"
success-output = "never"
status-level = "pass"
final-status-level = "all"
fail-fast = false
# 默认套件只含正确性测试；30s 是挂起检测，不作为性能门槛。
# 冷缓存 + 全核并行时进程级 fixture 测试可能超过 3s，30s 仍能及时截停挂死。
slow-timeout = { period = "30s", terminate-after = 1 }

[profile.slow]
default-filter = '''
binary(/^(gc_concurrency_model|gc_loom_model|handle_table|native_executable|native_executable_contract|node_vm_timeout_isolation|repl_line_edit)$/)
| test(/(^|::)slow__/)
| test(/happy__(async_hooks_|async_resource_|atomics_agent_notify|gc_|node_builtin_perf_hooks_|r1_accessor_slots|r2_ic_proto_and_gc|runtime_string_gc_roots|streams_byob_gc_pending_view)/)
| test(/modules__node_builtin_(cluster|perf_hooks|worker_threads)_/)
| test(/(allocation_pressure_collects_with_each_runtime_algorithm|host_table_reclaim::|large_array_churn_collects_before_cooperative_poll|live_set_exhaustion_is_observable_range_error_|lower_bundle_cached_perf_hooks_layout_and_cache_hit|native_executable_worker_file_collection_contracts)/)
'''
test-threads = "num-cpus"
failure-output = "immediate-final"
success-output = "never"
status-level = "pass"
final-status-level = "all"
fail-fast = false
# 慢用例允许冷启动/GC 压力等合法耗时；宽限到 300s。
slow-timeout = { period = "300s", terminate-after = 1 }

[profile.full]
default-filter = 'all()'
test-threads = "num-cpus"
failure-output = "immediate-final"
success-output = "never"
status-level = "pass"
final-status-level = "all"
fail-fast = false
# 全量 profile 同样不套 30s 硬门禁。
slow-timeout = { period = "300s", terminate-after = 1 }

[test-groups]
# perf_hooks / worker_threads 模块冷启动会构建同一 builtin 段；
# 串行执行避免多个进程并发重复构建，后续用例命中磁盘缓存。
slow-builtin-runtime = { max-threads = 1 }
slow-native-exec = { max-threads = 1 }
slow-repl-pty = { max-threads = 1 }

# 默认 profile 内不跑这些用例；override 保留给显式 -E 选择时使用。

[[profile.default.overrides]]
filter = 'test(/node_builtin_perf_hooks_/)'
test-group = 'slow-builtin-runtime'

[[profile.default.overrides]]
filter = 'test(/node_builtin_worker_threads_/)'
test-group = 'slow-builtin-runtime'

[[profile.default.overrides]]
filter = 'binary(/native_executable/)'
test-group = 'slow-native-exec'

[[profile.default.overrides]]
filter = 'binary(repl_line_edit)'
test-group = 'slow-repl-pty'

# slow profile：慢用例按资源独占/串行执行，避免互相争用 CPU 与 builtin 缓存。

[[profile.slow.overrides]]
filter = 'test(/node_builtin_perf_hooks_/)'
test-group = 'slow-builtin-runtime'

[[profile.slow.overrides]]
filter = 'test(/node_builtin_worker_threads_/)'
test-group = 'slow-builtin-runtime'

[[profile.slow.overrides]]
filter = 'test(/lower_bundle_cached_perf_hooks_layout_and_cache_hit/)'
test-group = 'slow-builtin-runtime'

[[profile.slow.overrides]]
filter = 'binary(/native_executable/)'
test-group = 'slow-native-exec'

[[profile.slow.overrides]]
filter = 'binary(repl_line_edit)'
test-group = 'slow-repl-pty'

[[profile.full.overrides]]
filter = 'test(/node_builtin_perf_hooks_/)'
test-group = 'slow-builtin-runtime'

[[profile.full.overrides]]
filter = 'test(/node_builtin_worker_threads_/)'
test-group = 'slow-builtin-runtime'

[[profile.full.overrides]]
filter = 'test(/lower_bundle_cached_perf_hooks_layout_and_cache_hit/)'
test-group = 'slow-builtin-runtime'

[[profile.full.overrides]]
filter = 'binary(/native_executable/)'
test-group = 'slow-native-exec'

[[profile.full.overrides]]
filter = 'binary(repl_line_edit)'
test-group = 'slow-repl-pty'
